<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2c45"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5b8"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#962d22"/>
      <stop offset="50%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#962d22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Full Background (Safe for Maskable) -->
  <rect width="512" height="512" fill="#0f141c"/>

  <!-- Subtle Radial Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="#f1c40f" opacity="0.08"/>

  <!-- Central Shield / Badge -->
  <rect x="76" y="76" width="360" height="360" rx="72" ry="72" fill="url(#badgeGrad)" stroke="url(#goldBorder)" stroke-width="8" filter="url(#shadow)"/>
  <rect x="88" y="88" width="336" height="336" rx="60" ry="60" fill="none" stroke="#f1c40f" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Top Stars & Title -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- 3 Stars -->
    <path d="M 216 142 L 220 152 L 230 153 L 222 160 L 225 170 L 216 164 L 207 170 L 210 160 L 202 153 L 212 152 Z" fill="#ffd700"/>
    <path d="M 256 132 L 261 144 L 273 145 L 264 153 L 267 165 L 256 158 L 245 165 L 248 153 L 239 145 L 251 144 Z" fill="#ffd700" filter="url(#glow)"/>
    <path d="M 296 142 L 300 152 L 310 153 L 302 160 L 305 170 L 296 164 L 287 170 L 290 160 L 282 153 L 292 152 Z" fill="#ffd700"/>

    <text x="256" y="202" font-family="'Noto Sans TC', 'Microsoft JhengHei', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="8">校園特企</text>
  </g>

  <!-- Giant GTA Letters -->
  <!-- 3D Shadow -->
  <text x="260" y="318" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="124" font-weight="900" fill="#000000" letter-spacing="4" opacity="0.9">GTA</text>
  <!-- Main GTA Text with Gold Gradient -->
  <text x="256" y="312" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="124" font-weight="900" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" letter-spacing="4" filter="url(#glow)">GTA</text>

  <!-- Bottom Ribbon: 校園開放世界 -->
  <g filter="url(#shadow)">
    <rect x="116" y="348" width="280" height="48" rx="24" fill="url(#redRibbon)" stroke="#ffd700" stroke-width="3"/>
    <text x="256" y="380" text-anchor="middle" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3">學校開放世界</text>
  </g>
</svg>
