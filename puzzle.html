<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>圖紙之間 · 玄關</title>
</head>
<body>
  <div id="pz-root">
    <div id="pz-canvas"></div>
    <div id="pz-grid"></div>
    <div id="pz-fade"></div>
    <div id="pz-hud">
      <div id="pz-status"><span id="pz-mode">現實</span><span id="pz-inv">持有物：無</span></div>
      <div id="pz-help">
        <b>操作</b>
        <div>WASD 移動</div><div>Space 跳</div><div>F / Q 切換視角</div><div>E 互動</div><div>R 重新開始</div>
      </div>
      <div id="pz-prompt"></div>
      <div id="pz-toast"></div>
    </div>
    <div id="pz-narration"></div>
    <div id="pz-clear">
      <h1>玄關 · 通關</h1>
      <p id="pz-next"></p>
      <button id="pz-replay" type="button">重玩</button>
    </div>
  </div>
  <script type="module" src="/src/puzzle/main.ts"></script>
</body>
</html>
